name: Build and release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.0
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run the tests
        run: flutter test

      - name: Read the version
        id: ver
        shell: pwsh
        run: |
          $line = Select-String -Path pubspec.yaml -Pattern '^version:\s*([0-9]+\.[0-9]+\.[0-9]+)' | Select-Object -First 1
          $v = $line.Matches[0].Groups[1].Value
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "Version $v"

      - name: Build
        run: flutter build windows --release --dart-define=SABLE_VERSION=${{ steps.ver.outputs.version }}

      - name: Add licences
        shell: pwsh
        run: |
          $dst = "build\windows\x64\runner\Release\licences"
          New-Item -ItemType Directory -Force -Path $dst | Out-Null
          Copy-Item "assets\fonts\Inter-OFL.txt", "assets\fonts\JetBrainsMono-OFL.txt" $dst
          Copy-Item "assets\reader\fonts\Literata-OFL.txt" $dst
          Copy-Item "assets\reader\foliate-js-LICENSE.txt" $dst

      - name: Make sure WebView2 is there for the self-test
        shell: pwsh
        run: |
          $keys = @(
            'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}',
            'HKLM:\SOFTWARE\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          )
          $v = $keys | ForEach-Object { (Get-ItemProperty -Path $_ -ErrorAction SilentlyContinue).pv } | Where-Object { $_ } | Select-Object -First 1
          if ($v) { Write-Host "WebView2 Runtime $v is installed" } else {
            Write-Host "Installing the WebView2 Runtime"
            Invoke-WebRequest -Uri "https://go.microsoft.com/fwlink/p/?LinkId=2124703" -OutFile "$env:RUNNER_TEMP\wv2.exe"
            Start-Process -FilePath "$env:RUNNER_TEMP\wv2.exe" -ArgumentList "/silent /install" -Wait
          }

      - name: Self-test the packaged app
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP "sable-root"
          $data = Join-Path $env:RUNNER_TEMP "sable-data"
          New-Item -ItemType Directory -Force -Path $root, $data | Out-Null
          $env:SABLE_ROOT = $root
          $env:SABLE_DATA = $data
          $p = Start-Process -FilePath "build\windows\x64\runner\Release\Sable.exe" -ArgumentList "--selftest" -PassThru
          if (-not $p.WaitForExit(300000)) { $p.Kill(); Write-Host "Self-test timed out" }
          $report = Join-Path $data "logs\selftest.txt"
          if (Test-Path $report) { Get-Content $report } else { Write-Host "No self-test report"; Get-ChildItem -Recurse $data | Format-Table FullName; exit 1 }
          New-Item -ItemType Directory -Force -Path "selftest-shots" | Out-Null
          Get-ChildItem (Join-Path $data "logs") -Filter "selftest-*.png" | ForEach-Object { Write-Host "Screenshot: $($_.Name) $($_.Length) bytes"; Copy-Item $_.FullName "selftest-shots\" }
          Copy-Item $report "selftest-shots\"
          if ($p.ExitCode -ne 0) { Write-Host "Self-test failed (exit $($p.ExitCode))"; exit 1 }

      - name: Package
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          $pkg = "package\Sable\App"
          New-Item -ItemType Directory -Force -Path $pkg | Out-Null
          Copy-Item -Recurse "build\windows\x64\runner\Release\*" $pkg
          Compress-Archive -Path "package\Sable" -DestinationPath "Sable-v$v-windows.zip" -CompressionLevel Optimal
          Get-Item "Sable-v$v-windows.zip" | Format-Table Name, Length

      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $v = "v${{ steps.ver.outputs.version }}"
          gh release view $v 2>$null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $v already exists. Raise the version in pubspec.yaml to publish a new one."
            exit 0
          }
          Compress-Archive -Path "selftest-shots\*" -DestinationPath "selftest-screenshots.zip"
          gh release create $v "Sable-${v}-windows.zip" "selftest-screenshots.zip" --title "Sable $v" --notes-file RELEASE_NOTES.md --target $env:GITHUB_SHA
