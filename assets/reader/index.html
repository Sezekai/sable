<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sable reader</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg, #000); color: var(--fg, #ddd); }
  body { font-family: system-ui, sans-serif; user-select: none; -webkit-user-select: none; }
  foliate-view { display: block; width: 100%; height: 100%; }
  #message { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 14px; color: var(--muted, #888); }
  #lightbox { position: fixed; inset: 0; background: rgba(0,0,0,.94); display: none; z-index: 10; cursor: zoom-out; overflow: hidden; }
  #lightbox.show { display: block; }
  #lightbox img { position: absolute; left: 50%; top: 50%; transform-origin: 0 0; max-width: none; max-height: none; cursor: grab; }
  #lightbox .hint { position: absolute; left: 0; right: 0; bottom: 14px; text-align: center; font-size: 12px; color: #aaa; }
</style>
<script type="module" src="sable.js"></script>
</head>
<body>
<div id="message">Opening the book…</div>
<div id="lightbox"><img alt=""><div class="hint">Scroll to zoom · drag to move · ← → other pictures · click outside or Esc to close</div></div>
</body>
</html>
