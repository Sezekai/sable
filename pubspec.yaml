name: sable
description: "Sable: a library and reader for books and light novels."
publish_to: 'none'

version: 1.2.1+6

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.1.0
  sqlite3: ^3.9.1
  archive: ^4.7.1
  path: ^1.9.1
  window_manager: ^0.5.1
  file_picker: ^13.3.3
  image: ^4.13.1
  crypto: ^3.0.8
  uuid: ^4.6.0
  xml: any
  flutter_inappwebview: any
  pdfrx: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/reader/
    - assets/reader/vendor/
    - assets/reader/fonts/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
    - family: JetBrains Mono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
